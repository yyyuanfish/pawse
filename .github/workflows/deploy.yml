name: deploy
# Every push to main redeploys the public demo on Cloud Run, keeping the service's existing secrets and
# settings (first-time setup and key changes still go through scripts/deploy_cloudrun.sh).
# One-time setup by the GCP project owner, in the repo's Settings → Secrets and variables → Actions:
#   variable GCP_PROJECT_ID  the project id
#   secret   GCP_SA_KEY      JSON key of a service account with Cloud Run Admin, Cloud Build Editor,
#                            Artifact Registry Writer, Storage Admin and Service Account User
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check setup
        id: setup
        env:
          KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PROJECT" ]; then
            echo "::warning::Deploy skipped: add the GCP_PROJECT_ID variable and GCP_SA_KEY secret (see .github/workflows/deploy.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.setup.outputs.ready == 'true'
      - uses: google-github-actions/auth@v2
        if: steps.setup.outputs.ready == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.setup.outputs.ready == 'true'
      - name: Deploy to Cloud Run
        if: steps.setup.outputs.ready == 'true'
        run: |
          gcloud run deploy pawse --project "${{ vars.GCP_PROJECT_ID }}" --region europe-west6 --source . --quiet
          URL=$(gcloud run services describe pawse --project "${{ vars.GCP_PROJECT_ID }}" --region europe-west6 --format 'value(status.url)')
          curl -fsS "$URL/api/v1/health" && echo && echo "Live: $URL"
